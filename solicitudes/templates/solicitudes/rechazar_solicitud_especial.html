{% extends 'base.html' %}
{% block title %}Rechazar Solicitud Especial #{{ solicitud.id }} — SISOL{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-10">
    <div class="max-w-lg mx-auto">
        <div class="bg-white rounded-3xl shadow-xl border border-[var(--border)] overflow-hidden">
            <div class="bg-red-600 p-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/20 p-3 rounded-2xl">
                        <i class="fa-solid fa-circle-xmark text-white text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-black text-white">Rechazar Solicitud Especial</h2>
                        <p class="text-red-200 text-sm mt-0.5">Solicitud #{{ solicitud.id }} · {{ solicitud.get_dia_semana_display }}</p>
                    </div>
                </div>
            </div>
            <div class="p-8">
                <form method="post" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-[var(--text-secondary)] mb-2">
                            Motivo del rechazo <span class="text-red-500">*</span>
                        </label>
                        <textarea name="observaciones" rows="4" required
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none text-sm resize-none"
                            placeholder="Explica el motivo del rechazo…"></textarea>
                    </div>
                    <div class="flex gap-3">
                        <a href="{% url 'solicitudes:detalle_solicitud_especial' solicitud.id %}"
                            class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl border border-[var(--border)] text-[var(--text-secondary)] font-semibold text-sm hover:bg-gray-50 transition-all">
                            Cancelar
                        </a>
                        <button type="submit"
                            class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm transition-all">
                            <i class="fa-solid fa-circle-xmark"></i>
                            Confirmar Rechazo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
