<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Solicitudes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #3b82f6;
            --accent-glow: #60a5fa;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
        }

        body {
            font-family: 'DM Sans', sans-serif;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }

        .pulse-ring {
            animation: pulse-ring 2s ease-out infinite;
        }

        .glass-login {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -8px rgba(59, 130, 246, 0.5);
        }

        .bg-pattern {
            background-color: var(--primary);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(96, 165, 250, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 40% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-pattern">

    <div class="w-full max-w-md">
        <div class="text-center mb-8 float-animation">
            <div class="relative inline-block">
                <div class="absolute inset-0 bg-blue-500 rounded-2xl blur-xl opacity-30"></div>
                <div class="relative w-20 h-20 mx-auto bg-gradient-to-br from-blue-400 to-blue-600 rounded-2xl flex items-center justify-center shadow-2xl">
                    <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </div>
                <div class="absolute -top-2 -right-2 w-6 h-6 bg-green-500 rounded-full border-2 border-white pulse-ring"></div>
            </div>
            <h1 class="text-3xl font-black text-white mt-6 tracking-tight">SISOL</h1>
            <p class="text-blue-300/70 text-sm mt-1">Gestión de Laboratorios Móviles</p>
        </div>

        <div class="glass-login rounded-3xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 p-1">
                <div class="bg-gradient-to-r from-blue-600 to-blue-500 p-6 text-center">
                    <h2 class="text-2xl font-bold text-white">Bienvenido</h2>
                    <p class="text-blue-100/80 text-sm mt-1">Ingresa tus credenciales</p>
                </div>
            </div>

            <div class="p-8">
                {% if messages %}
                {% for message in messages %}
                <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-red-600 text-sm flex items-center gap-3">
                    <i class="fa-solid fa-circle-exclamation text-lg"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
                {% endif %}

                <form method="post" class="space-y-6">
                    {% csrf_token %}

                    <div>
                        <label for="id_username" class="block text-sm font-semibold text-[var(--text-primary)] mb-2">Usuario</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-user text-blue-400"></i>
                            </div>
                            <input type="text" name="username" id="id_username" required autofocus
                                class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:ring-0 transition-all duration-200 outline-none input-glow text-[var(--text-primary)] placeholder:text-slate-400"
                                placeholder="Ingresa tu usuario">
                        </div>
                    </div>

                    <div>
                        <label for="id_password" class="block text-sm font-semibold text-[var(--text-primary)] mb-2">Contraseña</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-blue-400"></i>
                            </div>
                            <input type="password" name="password" id="id_password" required
                                class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:ring-0 transition-all duration-200 outline-none input-glow text-[var(--text-primary)]"
                                placeholder="Ingresa tu contraseña">
                        </div>
                    </div>

                    <button type="submit" class="btn-login w-full flex justify-center items-center gap-3 py-4 px-6 rounded-xl text-white font-semibold text-lg">
                        <span>Ingresar al Sistema</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-[var(--text-secondary)] text-sm">
                        ¿No tienes una cuenta?
                        <a href="{% url 'accounts:registro' %}" class="font-semibold text-blue-600 hover:text-blue-700 transition-colors">
                            Regístrate aquí
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
